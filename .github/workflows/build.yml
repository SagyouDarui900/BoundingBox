name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Clone AviUtl2 SDK
      run: |
        git clone --depth 1 https://github.com/kenkun0113/aviutl2_sdk.git external/aviutl2_sdk

    - name: Build BoundingBox.mod2
      run: |
        powershell -ExecutionPolicy Bypass -File .\build-BoundingBox.ps1 -SdkPath "external/aviutl2_sdk/include/aviutl2_sdk"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BoundingBox
        path: |
          BoundingBox.mod2
          BoundingBox.anm2

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          BoundingBox.anm2
          BoundingBox.mod2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
